<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essenza | Portfolio Académico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --oro: #C29A6C; --cafe: #2D1B14; --crema: #FDF8F3; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--crema); color: var(--cafe); }
        h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }
        .hero-bg {
            background: linear-gradient(rgba(45, 27, 20, 0.6), rgba(45, 27, 20, 0.6)), url('hero.jpg');
            background-size: cover; background-position: center;
        }
    </style>
</head>
<body class="scroll-smooth">

    <nav class="fixed w-full bg-white/95 backdrop-blur-sm z-50 border-b border-stone-200">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="logo.jpg" alt="Logo" class="h-10 w-10 object-contain">
            <span class="text-xl font-bold tracking-tighter serif uppercase">Essenza</span>
        </div>
        
        <button onclick="toggleMenu()" class="md:hidden text-[--cafe] focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
            </svg>
        </button>

        <div class="hidden md:flex space-x-8 text-[10px] font-bold uppercase tracking-widest">
            <a href="#inicio" class="hover:text-[--oro]">Inicio</a>
            <a href="#productos" class="hover:text-[--oro]">Gama</a>
            <a href="#ruleta" class="bg-[--cafe] text-white px-4 py-2 rounded-full hover:bg-[--oro] transition">Jugar</a>
        </div>
    </div>

    <div id="mobileMenu" class="hidden md:hidden bg-white border-b border-stone-200 flex flex-col items-center py-4 space-y-4 text-[10px] font-bold uppercase tracking-widest">
        <a href="#inicio" onclick="toggleMenu()" class="hover:text-[--oro]">Inicio</a>
        <a href="#productos" onclick="toggleMenu()" class="hover:text-[--oro]">Gama</a>
        <a href="#ruleta" onclick="toggleMenu()" class="text-[--oro]">Jugar ahora</a>
    </div>
</nav>

    <header id="inicio" class="hero-bg h-screen flex items-center justify-center text-center text-white">
        <div class="px-6 max-w-4xl">
            <h1 class="text-6xl md:text-8xl mb-4 uppercase">Essenza</h1>
            <p class="text-xl md:text-2xl italic serif mb-8 opacity-90">"Lo que tomas, te representa"</p>
            <a href="#productos" class="border border-white px-8 py-3 uppercase text-xs tracking-widest hover:bg-white hover:text-black transition">Ver Colección</a>
        </div>
    </header>

    <section id="productos" class="py-24 max-w-6xl mx-auto px-6">
        <h2 class="text-4xl serif text-center mb-16">Nuestra Gama</h2>
        <div class="grid md:grid-cols-3 gap-8 text-center">
            <div>
                <img src="hero.jpg" class="w-full h-64 object-cover rounded-xl mb-4 shadow-lg">
                <h3 class="text-xl serif">Essenza Puro</h3>
                <p class="text-xs text-stone-500 uppercase mt-2">Doble Expresso</p>
            </div>
            <div>
                <img src="cafe1.jpg" class="w-full h-64 object-cover rounded-xl mb-4 shadow-lg">
                <h3 class="text-xl serif">Essenza Calma</h3>
                <p class="text-xs text-stone-500 uppercase mt-2">Vainilla & Canela</p>
            </div>
            <div>
                <img src="cafe2.jpg" class="w-full h-64 object-cover rounded-xl mb-4 shadow-lg">
                <h3 class="text-xl serif">Essenza Intenso</h3>
                <p class="text-xs text-stone-500 uppercase mt-2">Miel & Cacao</p>
            </div>
        </div>
    </section>

    <section id="ruleta" class="py-24 bg-[--cafe] text-white text-center">
        <h2 class="text-4xl serif mb-12">Prueba tu Suerte</h2>
        <div class="flex justify-center mb-10 relative">
            <div class="absolute -top-4 w-0 h-0 border-l-[15px] border-l-transparent border-r-[15px] border-r-transparent border-t-[30px] border-t-red-600 z-20"></div>
            <div id="wheelWrapper" class="transition-transform duration-[5000ms] ease-[cubic-bezier(0.15,0,0.15,1)]">
                <svg width="300" height="300" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="48" fill="#C29A6C" stroke="#fff" stroke-width="1"/>
                    <path d="M50 50 L50 2 A48 48 0 0 1 83.9 14.1 Z" fill="#000" stroke="#fff" stroke-width="0.2"/>
                    <path d="M50 50 L83.9 14.1 A48 48 0 0 1 98 50 Z" fill="#FDF8F3" stroke="#000" stroke-width="0.2"/>
                    <path d="M50 50 L98 50 A48 48 0 0 1 83.9 85.9 Z" fill="#3D2B1F" stroke="#fff" stroke-width="0.2"/>
                    <path d="M50 50 L83.9 85.9 A48 48 0 0 1 50 98 Z" fill="#C29A6C" stroke="#000" stroke-width="0.2"/>
                    <path d="M50 50 L50 98 A48 48 0 0 1 16.1 85.9 Z" fill="#000" stroke="#fff" stroke-width="0.2"/>
                    <path d="M50 50 L16.1 85.9 A48 48 0 0 1 2 50 Z" fill="#FDF8F3" stroke="#000" stroke-width="0.2"/>
                    <path d="M50 50 L2 50 A48 48 0 0 1 16.1 14.1 Z" fill="#3D2B1F" stroke="#fff" stroke-width="0.2"/>
                    <path d="M50 50 L16.1 14.1 A48 48 0 0 1 50 2 Z" fill="#C29A6C" stroke="#000" stroke-width="0.2"/>
                </svg>
            </div>
        </div>
        <button onclick="spin()" id="spinBtn" class="bg-[--oro] text-[--cafe] px-10 py-4 rounded-full font-bold uppercase tracking-widest hover:scale-105 transition">Girar Ruleta</button>
        <div id="resultBox" class="hidden mt-8 text-2xl font-serif text-[--oro] animate-pulse"></div>
    </section>

    <footer class="py-10 text-center opacity-50 text-[10px] uppercase tracking-[0.5em]">Essenza 2026</footer>

    <script>
        function spin() {
            const wheel = document.getElementById('wheelWrapper');
            const btn = document.getElementById('spinBtn');
            const res = document.getElementById('resultBox');
            btn.disabled = true;
            
            const rand = Math.random() * 100;
            let target = 0; // "Ciao"
            if (rand < 50) target = 0; 
            else if (rand < 80) target = 1; // 10%
            else if (rand < 95) target = 3; // 50%
            else target = 5; // Taza

            const deg = 3600 - (target * 45);
            wheel.style.transform = `rotate(${deg}deg)`;

            setTimeout(() => {
                const premios = ["¡Ciao!", "10% DTO", "¡Ciao!", "50% DTO", "¡Ciao!", "TAZA REGALO", "¡Ciao!", "10% DTO"];
                res.classList.remove('hidden');
                res.innerText = premios[target];
                btn.innerText = "¡Suerte!";
            }, 5000);
        }
        function toggleMenu() {
        const menu = document.getElementById('mobileMenu');
        menu.classList.toggle('hidden');
    }
    </script>
</body>
</html>
